# Nombre de la aplicación que aparece en los registros de Spring Boot.
spring.application.name=p7springboot

# Archivos de mensajes: messages.properties (español, idioma base) y messages_en.properties (inglés).
spring.messages.basename=messages

# Los archivos de mensajes se leen en UTF-8 para admitir tildes y otros caracteres.
spring.messages.encoding=UTF-8

# Si falta un idioma, se usa messages.properties (español) y no el idioma del sistema operativo.
spring.messages.fallback-to-system-locale=false
