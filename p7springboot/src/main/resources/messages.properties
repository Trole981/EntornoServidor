# --- Actividades (cada una con sus datos prácticos) ---
actividad.ceramica.titulo=Taller de cerámica a mano
actividad.ceramica.descripcion=Aprende a modelar piezas con técnica de churros y a decorarlas con engobes. No hace falta experiencia previa.
actividad.ceramica.fecha=Sábado 14 de noviembre, 11:00
actividad.ceramica.duracion=2 horas y media
actividad.ceramica.lugar=Taller del patio

actividad.guitarra.titulo=Concierto de guitarra flamenca
actividad.guitarra.descripcion=Un recital íntimo con toques por soleá, granaína y tarantas, seguido de una charla con la guitarrista.
actividad.guitarra.fecha=Viernes 20 de noviembre, 20:30
actividad.guitarra.duracion=75 minutos
actividad.guitarra.lugar=Sala Alhambra

actividad.cine.titulo=Ciclo de cine mudo con piano en directo
actividad.cine.descripcion=Tres cortometrajes clásicos restaurados, acompañados por improvisación al piano. Versión sin diálogos.
actividad.cine.fecha=Jueves 26 de noviembre, 19:00
actividad.cine.duracion=90 minutos
actividad.cine.lugar=Sala de proyecciones

actividad.fotografia.titulo=Visita guiada: «Luz de barrio»
actividad.fotografia.descripcion=Recorrido comentado por una exposición de fotografía documental sobre la vida cotidiana en los barrios históricos.
actividad.fotografia.fecha=Domingo 29 de noviembre, 12:00
actividad.fotografia.duracion=45 minutos
actividad.fotografia.lugar=Galería principal

# --- Página de visita ---
visita.pagina=Tu visita · Centro Cultural Aljibe
visita.titulo=Organiza tu visita
visita.intro=Horarios, cómo llegar y algunos consejos para que disfrutes del centro sin prisas ni imprevistos.
visita.horarios.titulo=Horarios
visita.horarios.texto=De martes a sábado, de 10:00 a 21:00. Domingos, de 10:00 a 15:00. Los lunes el centro permanece cerrado.
visita.llegar.titulo=Cómo llegar
visita.llegar.texto=Está a diez minutos a pie de la parada de tranvía más cercana. Hay aparcamiento de bicicletas en la entrada y la zona es de acceso restringido a coches.
visita.accesibilidad.titulo=Accesibilidad
visita.accesibilidad.texto=Todas las salas son accesibles con silla de ruedas. Se dispone de bucle de inducción en la Sala Alhambra y de visitas guiadas en lengua de signos bajo petición.
visita.entradas.titulo=Entradas y reservas
visita.entradas.texto=Las exposiciones son de entrada libre. Los talleres y los conciertos requieren reserva previa en el mostrador o por teléfono, con aforo limitado.
visita.consejos.titulo=Consejos prácticos
visita.consejos.texto=Llega con 15 minutos de antelación, ven con calzado cómodo y consulta el tiempo: parte del recorrido transcurre por patios al aire libre.
visita.volver=Volver a las actividades
