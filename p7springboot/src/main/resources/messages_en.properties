actividad.fotografia.descripcion=A guided walk through a documentary photography exhibition about everyday life in the historic districts.
actividad.fotografia.fecha=Sunday 29 November, 12:00 pm
actividad.fotografia.duracion=45 minutes
actividad.fotografia.lugar=Main gallery

# --- Visit page ---
visita.pagina=Plan your visit · Aljibe Cultural Centre
visita.titulo=Plan your visit
visita.intro=Opening hours, how to get here and a few tips to enjoy the centre without rushing or surprises.
visita.horarios.titulo=Opening hours
visita.horarios.texto=Tuesday to Saturday, 10:00 am to 9:00 pm. Sundays, 10:00 am to 3:00 pm. The centre is closed on Mondays.
visita.llegar.titulo=Getting here
visita.llegar.texto=It is a ten-minute walk from the nearest tram stop. There is bicycle parking at the entrance, and cars are not allowed in the surrounding streets.
visita.accesibilidad.titulo=Accessibility
visita.accesibilidad.texto=All rooms are wheelchair accessible. Alhambra Hall has a hearing loop, and sign-language tours are available on request.
visita.entradas.titulo=Tickets and booking
visita.entradas.texto=Exhibitions are free. Workshops and concerts require advance booking at the front desk or by phone, and places are limited.
visita.consejos.titulo=Practical tips
visita.consejos.texto=Arrive 15 minutes early, wear comfortable shoes and check the weather: part of the route goes through open-air courtyards.
visita.volver=Back to activities
