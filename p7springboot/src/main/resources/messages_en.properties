actividad.ceramica.titulo=Hand-built pottery workshop
actividad.ceramica.descripcion=Learn to coil-build pieces and decorate them with slips. No previous experience needed.
actividad.ceramica.fecha=Saturday 14 November, 11:00 am
actividad.ceramica.duracion=2.5 hours
actividad.ceramica.lugar=Courtyard workshop

actividad.guitarra.titulo=Flamenco guitar concert
actividad.guitarra.descripcion=An intimate recital with solea, granaina and taranta pieces, followed by a talk with the guitarist.
actividad.guitarra.fecha=Friday 20 November, 8:30 pm
actividad.guitarra.duracion=75 minutes
actividad.guitarra.lugar=Alhambra Hall

actividad.cine.titulo=Silent film season with live piano
actividad.cine.descripcion=Three restored classic shorts accompanied by improvised piano. No dialogue, so no subtitles needed.
