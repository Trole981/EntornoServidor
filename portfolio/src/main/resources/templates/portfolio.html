<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>
        <p>Categoría: <span th:text="${categoria}"></span></p>
        <p>Año: <span th:text="${anio}"></span></p>
        <p th:if="${errorAnio != null}" th:text="${errorAnio}"></p>
        <ul>
            <li th:each="p : ${proyectos}" th:text="${p.titulo}"></li>
        </ul>

        <form method="get" th:action="@{/portfolio}">
            <select name="categoria">
                <option value="todas" th:selected="${categoria == 'todas'}">Todas</option>
                <option value="programacion" th:selected="${categoria == 'programacion'}">Programacion</option>
                <option value="diseño" th:selected="${categoria == 'diseño'}">Diseño</option>
                <option value="estructura" th:selected="${categoria == 'estructura'}">Estructura</option>
            </select>

            <input type="number" name="anio" th:value="${anio}">

            <button type="submit">Filtrar</button>
            <a th:href="@{/portfolio}">Mostrar todos</a>
        </form>
    </body>
</html>
